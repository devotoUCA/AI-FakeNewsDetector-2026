[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakenews"
version = "1.0.0"
description = "Detector de noticias falsas en texto (Inteligencia Artificial, UCA 2026)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fakenews = ["resources/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "slow: tests lentos (notebook, chequeos sobre el dataset completo)",
    "artifacts: requieren datos procesados y modelos entrenados (se saltean si faltan)",
]
